services:
  bili-ip-anchor:
    image: ghcr.io/vofficial404/bili-ip-anchor:latest
    # 想自己从源码构建，把上面一行注释掉，换成：
    # build: .
    container_name: bili-ip-anchor
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      INTERVAL: ${INTERVAL:-6h}
      JITTER: ${JITTER:-30m}
      BVIDS: ${BVIDS:-}
      BVID: ${BVID:-BV15HFVz1EvM} # v0.5 及更早的 .env 里只有这一项
      DO_DYNAMIC: ${DO_DYNAMIC:-false}
      DYNAMIC_TEXT: ${DYNAMIC_TEXT:-}
      PROXY: ${PROXY:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # 设置后启用 WebUI；留空则只在后台定时运行
      WEBUI_PASSWORD: ${WEBUI_PASSWORD:-}
    ports:
      # 默认只监听服务器本机，通过 SSH 隧道或 HTTPS 反向代理访问。
      # 确实要直接对公网开放，改成 "8080:8080"（明文 HTTP，不推荐）
      - "127.0.0.1:${WEBUI_PORT:-8080}:8080"
    volumes:
      - ./data:/data
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: "3"
