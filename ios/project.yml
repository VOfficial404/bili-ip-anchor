# XcodeGen 项目描述：xcodegen generate 生成 BiliIPAnchor.xcodeproj。
# 界面是 SwiftUI 原生写的（Sources/），先用 gomobile 把 Go 核心编成 Mobile.xcframework：
#   gomobile bind -target=ios -o ios/Mobile.xcframework ./mobile
name: BiliIPAnchor
options:
  bundleIdPrefix: io.github.vofficial404
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    MARKETING_VERSION: "0.8.0"
    CURRENT_PROJECT_VERSION: "800"
targets:
  BiliIPAnchor:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
    dependencies:
      - framework: Mobile.xcframework
        embed: false
    settings:
      base:
        PRODUCT_NAME: BiliIPAnchor
        PRODUCT_BUNDLE_IDENTIFIER: io.github.vofficial404.biliipanchor
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        OTHER_LDFLAGS: ["-lresolv"]
        ENABLE_BITCODE: NO
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Bili IP Anchor
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # 扫码时可以把二维码存进相册，再在 B 站 App 里从相册扫
        NSPhotoLibraryAddUsageDescription: 保存登录二维码，在 B 站 App 的「扫一扫」里从相册选这张图
    scheme: {}
