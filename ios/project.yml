# XcodeGen 项目描述：xcodegen generate 生成 BiliIPAnchor.xcodeproj。
# 先编译界面（和桌面客户端同一份 MyGo 代码）：cd desktop && go tool mygo build -platform web，
# 再用 gomobile 把 Go 核心编成 Mobile.xcframework：
#   gomobile bind -target=ios -o ios/Mobile.xcframework ./mobile
name: BiliIPAnchor
options:
  bundleIdPrefix: io.github.vofficial404
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    MARKETING_VERSION: "0.7.0"
    CURRENT_PROJECT_VERSION: "700"
targets:
  BiliIPAnchor:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
      # 界面文件，在 App 里是 web 文件夹
      - path: ../desktop/build/web
        type: folder
        buildPhase: resources
    dependencies:
      - framework: Mobile.xcframework
        embed: false
    settings:
      base:
        PRODUCT_NAME: BiliIPAnchor
        PRODUCT_BUNDLE_IDENTIFIER: io.github.vofficial404.biliipanchor
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        OTHER_LDFLAGS: ["-lresolv"]
        ENABLE_BITCODE: NO
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Bili IP Anchor
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # WebView 只打开 Go 核心在 127.0.0.1 上提供的界面（http）；连接服务器、访问 B 站都由 Go 核心发出
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    scheme: {}
