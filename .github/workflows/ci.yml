name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - run: go vet . ./core ./mobile
      - run: go build .
      - run: go test . ./core ./mobile
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

  # 桌面客户端的界面测试不开窗口，在 Windows 上跑（和大多数用户一样）
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - run: go vet ./desktop
      - run: go tool mygo vet .
        working-directory: desktop
      - run: go test ./desktop

