name: Release

# 推送 v* 标签时，把服务器二进制、桌面客户端安装包、Android APK 和 iOS IPA 发布到同一个 Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        run: |
          mkdir -p out
          for target in linux/amd64 linux/arm64 windows/amd64 darwin/arm64; do
            os=${target%/*}; arch=${target#*/}
            ext=""; [ "$os" = windows ] && ext=".exe"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
              -o "out/bili-ip-anchor_${os}_${arch}${ext}" .
          done

      - uses: actions/upload-artifact@v4
        with:
          name: Server
          if-no-files-found: error
          path: out/*

  desktop:
    uses: ./.github/workflows/desktop.yml
    with:
      version: ${{ github.ref_name }}

  mobile:
    uses: ./.github/workflows/mobile.yml
    with:
      version: ${{ github.ref_name }}
    secrets: inherit

  release:
    needs: [server, desktop, mobile]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir out
          find dist -type f -exec cp {} out/ \;
          cd out && sha256sum * > checksums.txt && ls -l
          gh release create "$GITHUB_REF_NAME" * \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
